name: Release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix (e.g. 3.2.8)
        required: true
        type: string
      push_images:
        description: Push Docker images to GHCR and Aliyun ACR
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  NIUMA_UI_VERSION: "1.1.7"
  ALIYUN_REGISTRY: crpi-25xt72cd1prwdj5s.cn-hangzhou.personal.cr.aliyuncs.com
  ALIYUN_NAMESPACE: datahub-images

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      push_images: ${{ steps.meta.outputs.push_images }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            PUSH_IMAGES="${{ github.event.inputs.push_images }}"
            IS_TAG="false"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            PUSH_IMAGES="true"
            IS_TAG="true"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "version is empty" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "push_images=${PUSH_IMAGES}" >> "$GITHUB_OUTPUT"
          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

  frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml
      - name: Install frontend deps
        working-directory: web/frontend
        run: |
          pnpm pkg set "dependencies.niuma-ui=${NIUMA_UI_VERSION}"
          # niuma-ui styles.css 的 @import "tailwindcss" 依赖宿主安装 Tailwind v4
          pnpm add -D tailwindcss@^4.3.2 @tailwindcss/vite@^4.3.2
          pnpm install --no-frozen-lockfile
      - name: Build frontend
        working-directory: web/frontend
        run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: web/frontend/dist
          if-no-files-found: error
          retention-days: 7

  package-linux:
    needs: [prepare, frontend]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: amd64
            arch: amd64
            oracle: "0"
            runner: ubuntu-latest
          - id: amd64-oracle
            arch: amd64
            oracle: "1"
            runner: ubuntu-latest
          - id: arm64
            arch: arm64
            oracle: "0"
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/frontend/dist
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unzip
      - uses: actions/cache@v5
        if: matrix.oracle == '1'
        with:
          path: .oracle
          key: oracle-instantclient-21.18-linux-amd64
      - name: Download Oracle Instant Client
        if: matrix.oracle == '1'
        run: bash .github/scripts/download-oracle-linux.sh
      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ORACLE: ${{ matrix.oracle }}
          GOARCH: ${{ matrix.arch }}
        run: bash .github/scripts/package-linux-ci.sh
      - uses: actions/upload-artifact@v7
        with:
          name: package-linux-${{ matrix.id }}
          path: dist/gateway-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  package-windows:
    needs: [prepare, frontend]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: standard
            oracle: "0"
          - id: oracle
            oracle: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/frontend/dist
      - uses: msys2/setup-msys2@v2.32.0
        id: msys2
        with:
          msystem: UCRT64
          update: false
          pacboy: gcc:p
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.oracle == '1'
      - uses: actions/cache@v5
        if: matrix.oracle == '1'
        with:
          path: .oracle
          key: oracle-instantclient-21.18-windows-amd64
      - name: Download Oracle Instant Client
        if: matrix.oracle == '1'
        shell: pwsh
        run: .github/scripts/download-oracle-windows.ps1
      - name: Add UCRT64 gcc to PATH
        shell: pwsh
        run: |
          $bin = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "ucrt64\bin"
          if (-not (Test-Path (Join-Path $bin "gcc.exe"))) {
            throw "gcc.exe not found in $bin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          $env:Path = "$bin;$env:Path"
          Write-Host "Using gcc at $bin"
          gcc --version
      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ORACLE: ${{ matrix.oracle }}
          CC: gcc
        shell: pwsh
        run: .github/scripts/package-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: package-windows-${{ matrix.id }}
          path: dist/gateway-*.zip
          if-no-files-found: error
          retention-days: 14

  docker-standard:
    needs: [prepare, frontend]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/frontend/dist
      - uses: docker/setup-buildx-action@v4
      - name: Resolve image names
        id: images
        env:
          ALIYUN_USER: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASS: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          set -euo pipefail
          LIST="ghcr.io/${{ github.repository }}"
          ALIYUN=false
          if [ -n "${ALIYUN_USER}" ] && [ -n "${ALIYUN_PASS}" ]; then
            LIST="${LIST}"$'\n'"${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/gateway"
            ALIYUN=true
          else
            echo "::warning::ALIYUN_USERNAME / ALIYUN_PASSWORD 未配置，跳过阿里云 ACR 推送"
          fi
          echo "aliyun=${ALIYUN}" >> "$GITHUB_OUTPUT"
          {
            echo "list<<EOF"
            printf '%s\n' "${LIST}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: needs.prepare.outputs.push_images == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: needs.prepare.outputs.push_images == 'true' && steps.images.outputs.aliyun == 'true'
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }},enable=${{ needs.prepare.outputs.is_tag == 'true' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ needs.prepare.outputs.push_images == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
            GIT_COMMIT=${{ github.sha }}
            ALPINE_MIRROR=
            DEBIAN_MIRROR=
          cache-from: type=gha,scope=docker-standard-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=docker-standard-${{ matrix.arch }}
          provenance: false
          sbom: false

  docker-oracle:
    needs: [prepare, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/frontend/dist
      - uses: docker/setup-buildx-action@v4
      - name: Resolve image names
        id: images
        env:
          ALIYUN_USER: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASS: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          set -euo pipefail
          LIST="ghcr.io/${{ github.repository }}"
          ALIYUN=false
          if [ -n "${ALIYUN_USER}" ] && [ -n "${ALIYUN_PASS}" ]; then
            LIST="${LIST}"$'\n'"${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/gateway"
            ALIYUN=true
          else
            echo "::warning::ALIYUN_USERNAME / ALIYUN_PASSWORD 未配置，跳过阿里云 ACR 推送"
          fi
          echo "aliyun=${ALIYUN}" >> "$GITHUB_OUTPUT"
          {
            echo "list<<EOF"
            printf '%s\n' "${LIST}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: needs.prepare.outputs.push_images == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: needs.prepare.outputs.push_images == 'true' && steps.images.outputs.aliyun == 'true'
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}-oracle
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/docker/Dockerfile.oracle
          platforms: linux/amd64
          push: ${{ needs.prepare.outputs.push_images == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
            GIT_COMMIT=${{ github.sha }}
            ALPINE_MIRROR=
            DEBIAN_MIRROR=
          cache-from: type=gha,scope=docker-oracle
          cache-to: type=gha,mode=min,scope=docker-oracle
          provenance: false
          sbom: false

  docker-manifest:
    needs: [prepare, docker-standard]
    if: needs.prepare.outputs.push_images == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Resolve image names
        id: images
        env:
          ALIYUN_USER: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASS: ${{ secrets.ALIYUN_PASSWORD }}
        run: |
          set -euo pipefail
          LIST="ghcr.io/${{ github.repository }}"
          ALIYUN=false
          if [ -n "${ALIYUN_USER}" ] && [ -n "${ALIYUN_PASS}" ]; then
            LIST="${LIST}"$'\n'"${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/gateway"
            ALIYUN=true
          else
            echo "::warning::ALIYUN_USERNAME / ALIYUN_PASSWORD 未配置，跳过阿里云 ACR 推送"
          fi
          echo "aliyun=${ALIYUN}" >> "$GITHUB_OUTPUT"
          {
            echo "list<<EOF"
            printf '%s\n' "${LIST}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: steps.images.outputs.aliyun == 'true'
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      - name: Create multi-arch tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          IS_TAG: ${{ needs.prepare.outputs.is_tag }}
          REPOS: ${{ steps.images.outputs.list }}
        run: |
          set -euo pipefail
          while IFS= read -r repo; do
            [ -z "${repo}" ] && continue
            TAGS=(-t "${repo}:${VERSION}")
            if [ "${IS_TAG}" = "true" ]; then
              TAGS+=(-t "${repo}:latest")
            fi
            docker buildx imagetools create "${TAGS[@]}" \
              "${repo}:${VERSION}-amd64" \
              "${repo}:${VERSION}-arm64"
          done <<< "${REPOS}"

  release:
    needs: [prepare, package-linux, package-windows]
    if: needs.prepare.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
