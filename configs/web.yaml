web:
  name: "Gateway Web服务"
  run_mode: "debug" # debug, release
  port: 12003
  # 进程级探活，挂在本控制面端口，不读网关实例配置。
  # 实例监听口探活见 app.gateway.health.path（默认 /_gw/health），实例听上才有。
  # 实例表损坏、端口占用、证书错误时数据面可能没起来，本接口仍应可访问。
  health:
    path: /health
  read_timeout: 120 # 秒
  write_timeout: 120 # 秒
  env: production # production, test, dev
  encryption_enabled: false # 生产环境请设置为true
  encryption_key: "your-strong-production-key"
  jwt_secret: "your-jwt-secret-key-here" # 生产环境请修改为强密钥
  
  # HTTPS 配置
  # 是否启用 HTTPS
  enable_https: false
  # SSL 证书文件路径 (当 enable_https 为 true 时必填)
  cert_file: ""
  # SSL 私钥文件路径 (当 enable_https 为 true 时必填)
  key_file: ""
  # 私钥密码（用于解密加密的私钥，如果私钥未加密则留空）
  key_password: ""
  
  # CORS配置
  cors:
    allowed_origins: "*" # 可设置为特定域名，以逗号分隔
    allowed_methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With,X-Token,X-User-Token,X-Trace-ID,X-Request-ID,traceparent"
    allow_credentials: true
    max_age: 86400 # 秒
  
  # 模板配置
  template:
    reload: true # 开发模式下开启，生产环境建议关闭
    cache: false # 开发模式下关闭，生产环境建议开启
  
  # 静态资源配置
  static:
    path: "./web/static"
    prefix: "/static" 
  
  # 前端静态资源配置
  frontend:
    path: "./web/frontend/dist"
    # prefix 是进程内路径。Go 按它挂 dist，接口在该路径的 /api 下。
    # 同一个域名用 /test、/pro 区分环境时，nginx 去掉外层后再转到这里。
    # 前端只打一份，浏览器上的 /test/gatewayweb、/pro/gatewayweb 打开页面时识别，不用按环境重打。
    prefix: "/gatewayweb" 