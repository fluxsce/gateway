<!doctype html>
<html lang="" class="app-booting">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/gatewayweb/assets/logo-CQ1xvCtI.png" id="web-icon-link" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 性能优化 - 预加载关键资源 -->
    <link rel="preload" href="/gatewayweb/assets/logo-CQ1xvCtI.png" as="image" type="image/png" />

    <title>Hub App</title>
    <style>
      /*
       * 必须与后续 _base.scss / Tailwind preflight 同一套盒模型。
       * 否则 niuma-ui CSS 注入时 * { box-sizing: border-box } 会把卡片
       * 从 content-box 改成 border-box：width 把 padding+边框吃进去，看起来突然小一圈。
       */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        --g-font-size-base: 14px;
      }
      html {
        height: 100%;
        font-size: 14px;
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
      }
      html.app-booting,
      html.app-booting body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background-color: #0c1020 !important;
        font-size: 14px !important;
        line-height: 1.5;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        background-color: #0c1020;
      }
      #app {
        height: 100%;
      }
      html.app-booting #app-boot-splash.app-loading,
      .app-loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex !important;
        visibility: visible !important;
        opacity: 1;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        overscroll-behavior: none;
        isolation: isolate;
        color-scheme: dark;
        /* 与 LoginView `.login-view` 同款底图/网格，避免摘 splash 时网格突然变大像缩放 */
        background:
          radial-gradient(90% 60% at 82% 12%, rgba(129, 140, 248, 0.32) 0%, transparent 58%),
          radial-gradient(70% 50% at 12% 86%, rgba(56, 189, 248, 0.14) 0%, transparent 55%),
          linear-gradient(155deg, #070b16 0%, #10152b 42%, #1a1840 78%, #241f4f 100%);
        background-color: #0c1020;
        color: rgba(255, 255, 255, 0.92);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
          'Noto Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .app-loading::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        opacity: 0.45;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, #000 20%, transparent 85%);
        -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, #000 20%, transparent 85%);
        pointer-events: none;
      }
      .app-loading::after {
        content: '';
        position: absolute;
        inset: -40%;
        z-index: 0;
        background: conic-gradient(
          from 210deg at 50% 50%,
          transparent 0deg,
          rgba(129, 140, 248, 0.08) 90deg,
          transparent 200deg
        );
        animation: app-login-glow 28s linear infinite !important;
        pointer-events: none;
      }
      @keyframes app-login-glow {
        to {
          rotate: 360deg;
        }
      }
      .app-loading__card {
        box-sizing: border-box;
        /* 用 100% 而不是 100vw，避免滚动条出现时视口宽度跳变 */
        width: min(520px, calc(100% - 48px));
        max-width: 520px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.45);
        border-radius: 16px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        padding: 18px 18px 16px;
        position: relative;
        z-index: 1;
      }
      .app-loading__card::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 16px;
        background: linear-gradient(145deg, rgba(99, 102, 241, 0.12), rgba(56, 189, 248, 0.08));
        opacity: 0.5;
        pointer-events: none;
      }
      .app-loading__row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .app-loading__brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        position: relative;
        z-index: 1;
      }
      .app-loading__logo {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.75);
        display: grid;
        place-items: center;
        overflow: hidden;
        flex: 0 0 auto;
        border: 1px solid rgba(148, 163, 184, 0.45);
      }
      .app-loading__logo img {
        width: 22px;
        height: 22px;
        display: block;
      }
      .app-loading__spinner {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        box-sizing: border-box;
        /* Tailwind preflight 会给 * 写 border:0，必须 !important 才能保住圆环 */
        border-style: solid !important;
        border-width: 2px !important;
        border-color: rgba(99, 102, 241, 0.25) !important;
        border-top-color: rgba(99, 102, 241, 0.95) !important;
        animation: appSpin 0.8s linear infinite !important;
        flex: 0 0 auto;
        position: relative;
        z-index: 1;
      }
      @keyframes appSpin {
        to {
          /* 用 rotate 独立属性，避开 Tailwind 在 * 上注册的 transform 变量 */
          rotate: 360deg;
        }
      }
      .app-loading__title {
        font-size: 14px;
        font-weight: 650;
        line-height: 20px;
        letter-spacing: 0.2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: rgba(15, 23, 42, 0.92);
      }
      .app-loading__desc {
        margin-top: 8px;
        font-size: 12px;
        line-height: 18px;
        color: rgba(51, 65, 85, 0.78);
        position: relative;
        z-index: 1;
      }
      .app-loading__bar {
        margin-top: 12px;
        height: 4px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.08);
        overflow: hidden;
        position: relative;
        z-index: 1;
      }
      .app-loading__bar-fill {
        display: block;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #6366f1, #8b5cf6);
        border-radius: 999px;
        animation: appIndeterminate 1.2s ease-in-out infinite !important;
      }
      @keyframes appIndeterminate {
        0% {
          translate: -120% 0;
        }
        100% {
          translate: 260% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-loading::after,
        .app-loading__spinner,
        .app-loading__bar-fill {
          animation: none !important;
        }
      }
    </style>
    <script type="module" crossorigin src="/gatewayweb/assets/index-BnHfvgka.js"></script>
  </head>
  <body>
    <div
      id="app-boot-splash"
      class="app-loading"
      role="status"
      aria-live="polite"
      aria-label="应用加载中"
    >
      <div class="app-loading__card">
        <div class="app-loading__row">
          <div class="app-loading__brand">
            <div class="app-loading__logo" aria-hidden="true">
              <img src="/gatewayweb/assets/logo-CQ1xvCtI.png" alt="" />
            </div>
            <div class="app-loading__title">正在加载应用…</div>
          </div>
          <div style="flex: 1 1 auto"></div>
          <div class="app-loading__spinner" aria-hidden="true"></div>
        </div>
        <div class="app-loading__desc">首次打开可能需要更久一点，请稍候。</div>
        <div class="app-loading__bar" aria-hidden="true">
          <span class="app-loading__bar-fill"></span>
        </div>
      </div>
    </div>
    <div id="app"></div>
  </body>
</html>
